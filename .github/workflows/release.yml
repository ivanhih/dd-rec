name: Build and Publish Release

# 触发条件: 推送 v* 格式的 tag(如 v1.0.5)
# 同时也允许 workflow_dispatch 手动触发(用于测试)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号(如 1.0.5-test),留空则用 tag 名'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # windows-latest runner 默认装 3.12,最稳
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller awscli

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.version }}" -ne "") {
            $VERSION = "${{ inputs.version }}"
          } else {
            $VERSION = "${{ github.ref_name }}" -replace '^v', ''
          }
          Write-Host "Building version: $VERSION"
          "version=$VERSION" >> $env:GITHUB_OUTPUT

      - name: Update version.py
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          (Get-Content version.py) -replace '__version__ = ".*"', "__version__ = `"$VERSION`"" | Set-Content version.py
          Write-Host "version.py updated:"
          Get-Content version.py

      - name: Build
        shell: pwsh
        run: |
          python build.py 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Error "build.py failed"
            exit 1
          }

      - name: List build artifacts
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -File |
            Where-Object { $_.Length -gt 1MB } |
            Select-Object FullName, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}} |
            Format-Table -AutoSize

      - name: Push to CNB (国内镜像)
        shell: pwsh
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          # CNB 用 git push 推 release 资产。workflow_dispatch 模式下不推(避免覆盖)
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            Write-Host "workflow_dispatch 模式,跳过 CNB 推送(避免覆盖现有 release)"
            exit 0
          }

          $VERSION_TAG = "${{ steps.version.outputs.version }}"   # X.Y.Z 不带 v
          $VERSION_REF = "${{ github.ref_name }}"                 # vX.Y.Z 带 v

          if (-not (Test-Path "dist/dd_rec.Install.${VERSION_TAG}.exe")) {
            Write-Error "找不到 install exe: dist/dd_rec.Install.${VERSION_TAG}.exe"
            exit 1
          }

          # 克隆 CNB 镜像仓库,上传 install.exe,创建/更新 release
          git clone "https://x-access-token:${CNB_TOKEN}@cnb.cool/tiange888-2026/dd-rec.git" cnb_repo --depth 1
          cd cnb_repo
          git checkout v${VERSION_REF} 2>$null || git checkout -b v${VERSION_REF}
          Copy-Item -Path "../dist/dd_rec.Install.${VERSION_TAG}.exe" -Destination "dd_rec.Install.${VERSION_TAG}.exe"
          Copy-Item -Path "../dist/dd_rec-${VERSION_TAG}-portable.7z" -Destination "dd_rec-${VERSION_TAG}-portable.7z"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dd_rec.Install.${VERSION_TAG}.exe dd_rec-${VERSION_TAG}-portable.7z
          git commit -m "release v${VERSION_REF}" || echo "nothing to commit"
          git push origin v${VERSION_REF}

          # 用 CNB API 创建 release(贴上两个资产)
          $body = @{
            tag_name  = "v${VERSION_TAG}"
            title     = "dd_rec-v${VERSION_TAG}"
            body      = "GitHub Actions 自动构建并推送到 CNB 镜像"
          } | ConvertTo-Json -Depth 3

          Invoke-RestMethod -Uri "https://api.cnb.cool/v1/tiange888-2026/dd-rec/releases" `
            -Method Post `
            -Headers @{ "cnbtoken" = "token ${CNB_TOKEN}" } `
            -Body $body `
            -ContentType "application/json"
          Write-Host "✓ CNB release 创建/更新成功"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'DD录播机 v${{ steps.version.outputs.version }}'
          draft: true
          generate_release_notes: true
          files: |
            dist/dd_rec-*portable.7z
            dist/DD录播机.Install.*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}